name: buildx

# 4.1.x branch: Omeka S 4.1 on PHP 8.3, published as the `4.1` tag. main builds
# develop and 4.2+ (PHP 8.4); this branch is kept apart until 4.1 support ends.
on:
  push:
    branches:
      - 4.1.x
  pull_request:
    branches:
      - 4.1.x
  workflow_dispatch:

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Omeka S versions
        id: matrix
        run: echo 'matrix=[{"omeka":"v4.1.1","tags":"4.1"}]' >> "$GITHUB_OUTPUT"

  buildx:
    needs: versions
    runs-on: ubuntu-latest
    name: buildx (${{ matrix.omeka }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      # Step 1: Checkout the code
      - name: Checkout
        uses: actions/checkout@v7

      # Step 2: Image names of this version, on Docker Hub and GHCR
      - name: Docker tags
        id: meta
        env:
          TAGS: ${{ matrix.tags }}
          IMAGE: ${{ github.repository }}
        run: |
          {
            echo 'tags<<EOF'
            for tag in ${TAGS//,/ }; do
              echo "$IMAGE:$tag"
              echo "ghcr.io/$IMAGE:$tag"
            done
            echo 'EOF'
            echo "first=ghcr.io/$IMAGE:${TAGS%%,*}"
          } >> "$GITHUB_OUTPUT"

      # Step 3: Set up QEMU for multi-platform builds
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      # Step 4: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      # Step 5: Login to DockerHub and GHCR
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Lint Dockerfile (the same for every version, so only once)
      - name: Hadolint Action
        if: strategy.job-index == 0
        uses: hadolint/hadolint-action@v3.5.0
        with:
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload SARIF results
        if: strategy.job-index == 0
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint-dockerfile

      # Step 7: Test build (for PRs)
      - name: Debug Build on PR
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load --build-arg OMEKA_VERSION=${{ matrix.omeka }} .

      # Step 8: Test the built image
      - name: Test
        env:
          OMEKA_VERSION: ${{ matrix.omeka }}
        run: |
          docker compose version
          docker compose --file docker-compose.test.yml up --exit-code-from sut --timeout 10 --build

      # Step 9: Build and Push to both registries in a single step
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/s390x
          build-args: |
            OMEKA_VERSION=${{ matrix.omeka }}
          cache-from: type=gha,scope=${{ matrix.omeka }}
          cache-to: type=gha,mode=max,scope=${{ matrix.omeka }}

      # Step 10: Run Trivy vulnerability scanner
      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.first }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
