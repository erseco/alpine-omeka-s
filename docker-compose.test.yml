---
services:
  app:
    build: &build
      context: .
      args:
        OMEKA_VERSION: ${OMEKA_VERSION:-develop}
    environment:
      SITE_URL: http://app:8080
      DB_HOST: mariadb
      DB_NAME: omeka_s
      DB_USER: omeka_s
      DB_PASSWORD: omeka_s
      OMEKA_ADMIN_EMAIL: admin@example.com
      OMEKA_ADMIN_NAME: "Site Administrator"
      OMEKA_ADMIN_PASSWORD: PLEASE_CHANGEME
      OMEKA_SITE_TITLE: "Omeka S Sample Site"
      OMEKA_THEMES: "default"
      OMEKA_MODULES: |
        Common
        EasyAdmin
      OMEKA_BLUEPRINT: /blueprint.json
    volumes:
      - "./examples/blueprint.json:/blueprint.json:ro"
    depends_on:
      - mariadb

  # The same image on SQLite (experimental), with no database service
  app-sqlite:
    build: *build
    environment:
      SITE_URL: http://app-sqlite:8080
      DB_DRIVER: pdo_sqlite
      OMEKA_ADMIN_EMAIL: admin@example.com
      OMEKA_ADMIN_PASSWORD: PLEASE_CHANGEME
      OMEKA_SITE_TITLE: "Omeka S SQLite Site"
    volumes:
      - sqlite_volume:/var/www/html/volume

  mariadb:
    image: mariadb:lts
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: true
      MYSQL_ROOT_PASSWORD: omeka_s
      MYSQL_DATABASE: omeka_s
      MYSQL_USER: omeka_s
      MYSQL_PASSWORD: omeka_s

  sut:
    image: alpine:latest
    depends_on:
      - app
      - app-sqlite
    environment:
      - SOURCE_BRANCH
    command: /tmp/run_tests.sh
    volumes:
      - "./run_tests.sh:/tmp/run_tests.sh:ro"
      - "sqlite_volume:/sqlite:ro"

volumes:
  sqlite_volume:
